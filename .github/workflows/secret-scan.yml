name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_ref:
        description: 'Optional commit/ref to inspect (defaults to current commit)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks and TruffleHog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # PRs cannot replace the scanner, tool installer or allowlist with their own version.
      - name: Check out trusted scan controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: controls
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.1
          working_directory: controls
          cache: false
      - name: Check out content to scan
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.scan_ref || github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commit history without credential verification
        working-directory: controls
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
        run: |
          tip=$(git -C ../candidate rev-parse HEAD)
          printf 'ci %s ci %s\n' "$tip" "$SCAN_BASE" |
            mise exec -- python3 scripts/check-push-secrets.py ../candidate
